name: Auditing

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches:
      - '*'

jobs:
  license-audit:
    name: License Auditing
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm i

      # Check license headers (v2.0.0)
      - uses: erisu/apache-rat-action@46fb01ce7d8f76bdcd7ab10e7af46e1ea95ca01c

      # Check node package licenses (v2.0.0)
      - uses: erisu/license-checker-action@1c222d0c2f5898a4c40b8bd6fd6888650bd6f68a
        with:
          license-config: 'licence_checker.yml'
          include-asf-category-a: true

  codeql-audit:
    name: CodeQL Auditing
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm i

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-and-quality
          config: |
            paths-ignore:
              - node_modules

      - uses: github/codeql-action/analyze@v4
